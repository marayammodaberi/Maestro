appId: com.practicalidea.gobolia.dev
---
- launchApp
- assertVisible: "Who is this device for?"
- tapOn: "Supervisor"
- tapOn: "Continue"
- assertVisible: "Enter your phone number"
- tapOn: "Phone number"
- inputText: "09304216502"
- tapOn: "Send code"
- assertVisible: "Enter the code we sent you"
- inputText: "112000"
- assertNotVisible: "Enter the code we sent you"
- tapOn: "Book appointment"
- tapOn: "Select date"
- tapOn: "Next day"
- tapOn: "Choose time"
- tapOn: "Book"
- assertVisible: "Appointment booked successfully"
