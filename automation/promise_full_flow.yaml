# فلوی کامل end-to-end «قول و قرار»
# سرپرست وارد می‌شود -> فرزند اضافه می‌کند -> قول‌وقرار با فرزند می‌سازد
# -> با کد فرزند یک حساب مستقل کودک ساخته می‌شود
# -> یک حساب تراپیست ثبت‌نام می‌شود و با همان کد فرزند به او متصل می‌شود
# -> قول‌وقرار تراپیست-کودک ساخته و پیام ارسال می‌شود
#
# نکته: مقادیر OTP و کدها ثابت (mock/test) هستند و فقط برای محیط تست معتبرند.
# نکته: مرحله‌ی انتخاب «نسبت» در افزودن فرزند مطابق BUG-07 ممکن است ثبت نشود؛
#       این فلو همچنان تلاش برای انتخاب آن را انجام می‌دهد تا رفتار واقعی پوشش داده شود.

appId: com.practicalidea.gobolia.dev

---
# ۱. ورود سرپرست
- launchApp
- assertVisible: "این دستگاه برای چه کسی است؟"
- tapOn: "سرپرست"
- tapOn: "ادامه"
- assertVisible: "شماره تلفن خودتون رو وارد کنید."
- tapOn: "شماره موبایل"
- inputText: "09304216502"
- tapOn: "تایید و دریافت کد"
- assertVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- inputText: "112000"
- assertNotVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."

# ۲. افزودن فرزند
- tapOn: "افزودن فرزند"
- tapOn:
    id: "child_name_input"
    optional: true
- inputText: "کودک ۱"
- tapOn: "تاریخ تولد"
- inputText: "1400/07/22"
- tapOn: "پسر"
- tapOn: "کودک۲"
- inputText: "کودک ۱"
# تلاش برای انتخاب نسبت - مطابق BUG-07 ممکن است ثبت نشود
- tapOn:
    text: ".*نسبت.*|.*خواهر.*"
    optional: true
- tapOn: "خواهر"
- tapOn: "بعدی"

# ۳. ساخت قول‌وقرار سرپرست-کودک
- tapOn: "ساخت قول و قرار"
- tapOn: "عنوان قول و قرار"
- inputText: "قول و قرار من و خانواده"
- tapOn: "تاریخ شروع"
- inputText: "1405/06/22"
- tapOn: "تاریخ پایان"
- inputText: "1405/06/31"
- tapOn: "کنتکممن"
- tapOn: "کودک"
- tapOn: "ساخت"
- assertVisible: "قول و قرار من و خانواده"

# ۳.۱ افزودن یک قول در بخش مدیریت قول و قرار
- tapOn: "مدیریت قول و قرار"
- tapOn:
    id: "add_promise_button"
    optional: true
- tapOn: "عنوان قول"
- inputText: "قول صحبت"
- tapOn: "کنتکممن"
- tapOn: "ساخت"
- assertVisible: "قول صحبت"
- tapOn: "امضای قول و قرار"

# ۴. دریافت کد اختصاصی کودک از پروفایل فرزند ایجادشده
- tapOn: "پروفایل کودک"
- assertVisible: "58100774"
- copyTextFrom:
    id: "child_code_text"

# ۵. خروج از حساب سرپرست (از طریق مد سرپرست، مطابق BUG-08 برای نقش کودک راه مستقیمی وجود ندارد)
- tapOn: "پروفایل"
- tapOn: "خروج از حساب"

# ۶. ثبت‌نام مستقل حساب کودک با کد دریافت‌شده
- launchApp
- tapOn: "کودک"
- tapOn: "ادامه"
- tapOn: "کد کودک"
- inputText: "58100774"
- tapOn: "تایید"
- assertVisible: "کودک ۱"

# ۷. ثبت‌نام حساب تراپیست
- launchApp
- tapOn: "ثبت‌نام یا ورود به عنوان تراپیست"
- tapOn: "ثبت‌نام یا ورود به عنوان تراپیست"
- assertVisible: "شماره تلفن خودتون رو وارد کنید."
- tapOn: "شماره موبایل"
- inputText: "09304216502"
- tapOn: "تایید و دریافت کد"
- assertVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- inputText: "112000"
- tapOn: "شماره نظام پزشکی"
- inputText: "123456"
- tapOn: "نام و نام خانوادگی"
- inputText: "روان‌شناس تست"
- tapOn: "بارگذاری عکس پروفایل"
# در صورت رخداد BUG-09، خطای مرتبط با نبود عکس نمایش داده نمی‌شود
- tapOn: "ثبت‌نام"

# ۸. اتصال تراپیست به کودک با کد کودک و ساخت قول‌وقرار
- tapOn: "کد کودک"
- inputText: "58100774"
- tapOn: "تایید"
- assertVisible: "کودک ۱"
- tapOn: "ساخت قول و قرار"
- tapOn: "عنوان قول و قرار"
- inputText: "قول و قرار جلسه مشاوره"
- tapOn: "ساخت"
- assertVisible: "قول و قرار جلسه مشاوره"

# ۹. ارسال پیام آزمایشی به کودک
- tapOn: "کودک"
- tapOn: "پیام خودتون رو بنویسید"
- inputText: "سلام کودک چطوری"
- tapOn:
    id: "send_button"
    optional: true
- assertVisible: "سلام کودک چطوری"
