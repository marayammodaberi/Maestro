# فلوی اتومیشن ثبت‌نام / ورود - پوشش هر سه نقش
# اصلاح‌شده: با استفاده از کد آزمایشی OTP (112000) که برای محیط تست در دسترس است،
# ورود برای هر سه نقش تا نمایش صحیح صفحه‌ی اصلی هر نقش کامل بررسی می‌شود.

appId: com.practicalidea.app   # جایگزین با package name واقعی
---
- launchApp
- assertVisible: "این دستگاه برای چه کسی است؟"

# تست نقش سرپرست
- tapOn: "سرپرست"
- tapOn: "ادامه"
- assertVisible: "شماره تلفن خودتون رو وارد کنید."
- tapOn: "شماره موبایل"
- inputText: "09304216502"
- tapOn: "تایید و دریافت کد"
- assertVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- assertVisible: "کد به این شماره ارسال شد"
- inputText: "112000"
- assertNotVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- back

# بازگشت و تست نقش کودک
- launchApp
- tapOn: "کودک"
- tapOn: "ادامه"
- assertVisible: "شماره تلفن خودتون رو وارد کنید."
- tapOn: "شماره موبایل"
- inputText: "09304216502"
- tapOn: "تایید و دریافت کد"
- assertVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- inputText: "112000"
- assertNotVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- back

# تست نقش تراپیست (از لینک پایین صفحه)
- launchApp
- tapOn: "ثبت‌نام یا ورود به عنوان تراپیست"
- assertVisible: "شماره تلفن خودتون رو وارد کنید."
- tapOn: "شماره موبایل"
- inputText: "09304216502"
- tapOn: "تایید و دریافت کد"
- assertVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
- inputText: "112000"
- assertNotVisible: "لطفاً کدی که براتون ارسال شده رو وارد کنید."
